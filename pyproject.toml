[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "my02009-promptlead_jd338"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别Prompt 工程负责人·训练数据配比与课程学习上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "my02009" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://my02009.github.io"
Repository = "https://github.com/my02009/promptlead_jd338"
Issues = "https://github.com/my02009/promptlead_jd338/issues"

[project.scripts]
promptlead_jd338 = "promptlead_jd338:main"

[tool.setuptools]
py-modules = ["promptlead_jd338"]
